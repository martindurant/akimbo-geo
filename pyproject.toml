[build-system]
requires = ["hatchling>=1.8.0"]
build-backend = "hatchling.build"

[project]
name = "akimbo-geo"
version = "0.1.0"
description = "Geometry operations accessor for akimbo — nested/var-length geometry columns"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    { name = "Martin Durant", email = "mdurant@anaconda.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "akimbo",
    "numba",
    "pyarrow",
    "numpy",
]

[project.optional-dependencies]
convert = ["shapely>=2.0"]
geopandas = ["geopandas", "shapely>=2.0"]
spatialpandas = ["spatialpandas"]
test = [
    "pytest",
    "pytest-cov",
    "pandas",
    "shapely>=2.0",
    "spatialpandas",
    "geopandas",
]

[project.urls]
Homepage = "https://github.com/intake/akimbo"
"Bug Tracker" = "https://github.com/intake/akimbo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/akimbo_geo"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
]
log_cli_level = "DEBUG"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "raise NotImplementedError",
]
exclude_also = [
    # Numba JIT function bodies cannot be traced by coverage
    "@ngjit",
    "@ngpjit",
]
fail_under = 75
show_missing = true

[tool.coverage.run]
source = ["src/akimbo_geo"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.ruff]
ignore = ["E501"]
